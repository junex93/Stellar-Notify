name: ci
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: rustup target add wasm32v1-none
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config
      - run: cargo install --locked stellar-cli
      - run: npm i -g pnpm@10 && pnpm install --frozen-lockfile
      - run: cargo fmt --check --manifest-path contracts/channels/Cargo.toml
      - run: cargo clippy --all-targets --manifest-path contracts/channels/Cargo.toml -- -D warnings
      - run: pnpm contracts:test
      - run: pnpm contracts:doctor
      - run: pnpm contracts:build
  ts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: notify
          POSTGRES_PASSWORD: notify
          POSTGRES_DB: notify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notify" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://notify:notify@localhost:5432/notify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i -g pnpm@10 && pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
